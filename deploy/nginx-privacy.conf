# Mounted into the site container by compose.yaml (ADR-0015 iii). Stock nginx writes every
# visitor's address to its access log, and a request for a missing file puts it in the error
# log too ("client: <address>"). Either breaks ADR-0004's promise that Linkling keeps no IP
# addresses. These two lines stop both.
access_log off;
log_not_found off;

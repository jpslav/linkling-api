# Mounted into the site container by compose.yaml (ADR-0015 iii). Stock nginx writes every
# visitor's address to its access log, and its error log adds "client: <address>" to every
# request-level error: a missing file (404), an oversized body (413), a directory with no
# index (403), and more. Any of those breaks ADR-0004's promise that Linkling keeps no IP
# addresses.
access_log off;
log_not_found off;
# The error log is off for request handling altogether, not just quieter: nginx attaches
# the client's address to a request-level error at any level, including `crit` (measured:
# a docroot entry that is not a regular file). Startup and configuration
# errors still reach `docker compose logs web`, from the main context's own error log.
error_log /dev/null;

# --mutate web-net: nginx's stock server, plus a mirror that copies every page request to
# 198.51.100.8 (TEST-NET-2, RFC 5737, reaches nobody) -- the shape of a request-logging
# analytics hook. The check must fail and name that address.
server {
    listen       80;
    server_name  localhost;
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        mirror /linkling-mutation-mirror;
    }
    location = /linkling-mutation-mirror {
        internal;
        proxy_connect_timeout 1s;
        proxy_pass http://198.51.100.8$request_uri;
    }
}

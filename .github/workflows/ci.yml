name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q

  # The compose stack's service, started from nothing on Linux: it answers, a link survives
  # `down` and `up`, the documented backup is sound, and the logs hold no client address
  # (scripts/compose-smoke.sh). Linux is also where the bind mount's root ownership bites,
  # which Docker Desktop hides (ADR-0015 ii).
  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/compose-smoke.sh

  # The service sends nothing to anyone but the client (ADR-0009, scripts/no-third-party-check.sh).
  # Only the service: the site needs the private linkling-web checkout, which this workflow's
  # token cannot fetch (ADR-0015). The second step is the red that makes the first one mean
  # something: a service that fetches on every create must fail, naming the address it reached.
  no-third-party:
    name: no-third-party
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/no-third-party-check.sh --api-only
      - name: the check fails a service that fetches on create
        run: |
          set +e
          out="$(scripts/no-third-party-check.sh --api-only --mutate api 2>&1)"
          status=$?
          echo "$out"
          [ "$status" = 1 ] && grep -q 'the first IP to 198\.51\.100\.7\.80' <<<"$out"

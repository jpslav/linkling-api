[project]
name = "linkling"
version = "0.0.0"
description = "The Linkling service: API, redirects, click counts, stats page, CLI."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"linkling.server" = ["migrations/*.sql", "privacy/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
